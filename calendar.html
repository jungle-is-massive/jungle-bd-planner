<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jungle — Event Calendar</title>
<link rel="icon" type="image/png" href="https://junglecreations.com/favicon-32x32.png?v=1b5e54ab68eeaed11a7dbfe7d0035e99">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F5F0E8;
  --black: #0E0E0E;
  --green: #87FB66;
  --green-dim: #65C247;
  --grey: #C8C3B8;
  --grey-mid: #8A8880;
  --grey-light: #E8E3DA;
  --white: #FFFFFF;
  --row-h: 56px;
  --header-h: 64px;
  --col-w: 80px;
  --sidebar-w: 190px;
  --c-intermediary: #7B6FE0;
  --c-owned: #87FB66;
  --c-speaking: #FF6B4A;
  --c-attendance: #4ABFFF;
  --c-content: #F0B429;
  --c-nurture: #3ECF8E;
  --border: #E0DBD3;
  --border-strong: #C8C3B8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--cream); color: var(--black); font-family: 'DM Sans', system-ui, sans-serif; height: 100%; }

/* TOPBAR */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--header-h); background: var(--black);
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 28px;
}
#topbar .topbar-right { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.wordmark { font-size: 17px; font-weight: 800; letter-spacing: -0.03em; color: var(--cream); white-space: nowrap; }
.wordmark span { color: var(--green); }
.nav-tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.07); border-radius: 100px; padding: 4px; }
.nav-tab { padding: 7px 18px; border-radius: 100px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--grey); letter-spacing: 0.02em; transition: background 0.15s, color 0.15s; text-decoration: none; display: inline-block; }
.nav-tab.active { background: var(--green); color: var(--black); }
.nav-tab:hover:not(.active) { color: var(--cream); }
.add-btn { background: var(--black); color: var(--cream); border: 1px solid rgba(255,255,255,0.15); border-radius: 100px; padding: 7px 16px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
.add-btn:hover { background: rgba(255,255,255,0.18); }

/* PAGE WRAP */
.page-body { margin-top: var(--header-h); }

/* CALENDAR */
#planner-wrap { overflow-x: auto; overflow-y: visible; padding-bottom: 100px; }
#month-header-sticky { position: sticky; top: var(--header-h); z-index: 90; background: var(--cream); border-bottom: 1px solid var(--grey-light); }
#month-header-inner { overflow: hidden; }
#month-header { display: grid; }
.month-label { padding: 14px 0 10px; text-align: center; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--grey-mid); border-left: 1px solid var(--grey-light); }
.month-label.current { color: var(--black); font-weight: 700; }
#planner { display: grid; position: relative; }

.section-header { display: grid; grid-template-columns: var(--sidebar-w) 1fr; align-items: center; padding: 14px 20px 14px 0; cursor: pointer; user-select: none; }
.section-header:hover .section-title { opacity: 0.6; }
.section-title { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey-mid); padding: 0 16px; transition: opacity 0.15s; display: flex; align-items: center; gap: 8px; }
.section-chevron { width: 8px; height: 5px; transition: transform 0.15s; color: var(--grey-mid); }
.section-chevron svg { width: 100%; height: 100%; fill: currentColor; }
.section-group { border-bottom: 1px solid var(--grey-light); }
.section-group.collapsed .section-chevron { transform: rotate(-90deg); }
.section-group.collapsed .section-rows { display: none; }

.row { display: grid; height: var(--row-h); align-items: center; border-top: 1px solid var(--grey-light); position: relative; padding-right: 20px; }
.row:hover { background: rgba(0,0,0,0.015); }
.row-label { padding: 0 16px; font-size: 11px; font-weight: 600; color: var(--black); line-height: 1.3; letter-spacing: -0.01em; }
.row-cell { height: 100%; border-left: 1px solid var(--grey-light); position: relative; }

.placeholder-row { display: grid; height: var(--row-h); align-items: center; border-top: 1px solid var(--grey-light); opacity: 0.4; padding-right: 20px; }
.placeholder-label { padding: 0 16px; font-size: 11px; font-weight: 600; color: var(--grey-mid); font-style: italic; }
.placeholder-cell { height: 100%; border-left: 1px solid var(--grey-light); display: flex; align-items: center; justify-content: center; }
.placeholder-dash { width: 12px; height: 1px; background: var(--grey-light); }

.row-icon-btn { background: none; border: none; cursor: pointer; font-size: 11px; line-height: 1; padding: 3px 4px; border-radius: 4px; color: var(--grey-mid); font-family: inherit; opacity: 0.55; transition: opacity 0.12s, background 0.12s, color 0.12s; }
.row-icon-btn:hover { opacity: 1; background: var(--grey-light); }
.row-delete-icon:hover { color: #ef4444; background: #fee2e2; }
.row-edit-icon:hover { color: var(--black); }

.today-line { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--green); z-index: 5; pointer-events: none; }
.event-dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; cursor: pointer; z-index: 10; top: 50%; transform: translateY(-50%); transition: transform 0.15s, box-shadow 0.15s; }
.event-dot.category-intermediary { background: var(--c-intermediary); }
.event-dot.category-owned { background: var(--c-owned); border: 1.5px solid var(--black); }
.event-dot.category-speaking { background: var(--c-speaking); }
.event-dot.category-attendance { background: var(--c-attendance); }
.event-dot.category-content { background: var(--c-content); }
.event-dot.category-nurture { background: var(--c-nurture); }
.event-dot:hover { transform: translateY(-50%) scale(1.3); box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.event-bar { position: absolute; height: 20px; border-radius: 100px; cursor: pointer; z-index: 10; top: 50%; transform: translateY(-50%); transition: opacity 0.15s; display: flex; align-items: center; padding: 0 8px; overflow: hidden; }
.event-bar.category-intermediary { background: var(--c-intermediary); }
.event-bar.category-intermediary span { color: white; }
.event-bar.category-owned { background: var(--c-owned); border: 1.5px solid var(--black); }
.event-bar.category-owned span { color: var(--black); }
.event-bar.category-speaking { background: var(--c-speaking); }
.event-bar.category-speaking span { color: white; }
.event-bar.category-attendance { background: var(--c-attendance); }
.event-bar.category-attendance span { color: white; }
.event-bar.category-content { background: var(--c-content); }
.event-bar.category-content span { color: var(--black); }
.event-bar.category-nurture { background: var(--c-nurture); }
.event-bar.category-nurture span { color: var(--black); }
.event-dot:hover { transform: translateY(-50%) scale(1.3); box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.event-bar { position: absolute; height: 20px; border-radius: 100px; cursor: pointer; z-index: 10; top: 50%; transform: translateY(-50%); transition: opacity 0.15s; display: flex; align-items: center; padding: 0 8px; overflow: hidden; }
.event-bar:hover { opacity: 0.85; }
.event-bar-label { font-size: 10px; font-weight: 700; color: var(--black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prep-bar { position: absolute; height: 6px; border-radius: 100px; opacity: 0.2; z-index: 8; top: 50%; transform: translateY(-50%); pointer-events: none; }
.cluster-dot { position: absolute; border-radius: 50%; cursor: pointer; z-index: 11; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: var(--white); background: var(--black); }

#tooltip { position: fixed; background: var(--black); color: var(--cream); border-radius: 8px; padding: 10px 14px; font-size: 12px; max-width: 220px; z-index: 500; pointer-events: none; opacity: 0; transition: opacity 0.1s; }
#tooltip.visible { opacity: 1; }
.tt-name { font-weight: 700; margin-bottom: 2px; }
.tt-date, .tt-loc { color: var(--grey); font-size: 11px; }

#legend { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--black); border-radius: 100px; display: flex; align-items: center; gap: 18px; padding: 9px 22px; z-index: 90; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
.legend-item { display: flex; align-items: center; gap: 6px; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.cp-tier { display: inline-block; border-radius: 100px; font-family: 'DM Mono', monospace; font-weight: 700; text-transform: uppercase; }
.cp-tier.buzz { background: rgba(74,191,255,0.15); color: #0a5a8c; }
.cp-tier.rumble { background: rgba(240,180,41,0.18); color: #7a4e00; }
.cp-tier.roar { background: rgba(255,107,74,0.18); color: #8a2400; }

/* EVENT DETAIL MODAL */
#modal-overlay { position: fixed; inset: 0; background: rgba(14,14,14,0.6); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
#modal-overlay.open { opacity: 1; pointer-events: all; }
#modal { background: var(--cream); border-radius: 16px; width: min(560px, 94vw); max-height: 85vh; overflow-y: auto; position: relative; transform: translateY(20px); transition: transform 0.25s; box-shadow: 0 24px 64px rgba(0,0,0,0.25); }
#modal-overlay.open #modal { transform: translateY(0); }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 26px 26px 16px; border-bottom: 1px solid var(--grey-light); }
.modal-cat-pill { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 10px; border-radius: 100px; margin-bottom: 10px; display: inline-block; }
.modal-cat-pill.intermediary { background: var(--c-intermediary); color: white; }
.modal-cat-pill.owned { background: var(--c-owned); color: var(--black); }
.modal-cat-pill.speaking { background: var(--c-speaking); color: white; }
.modal-cat-pill.attendance { background: var(--c-attendance); color: white; }
.modal-cat-pill.content { background: var(--c-content); color: var(--black); }
.modal-cat-pill.nurture { background: var(--c-nurture); color: var(--black); }
.modal-title { font-size: 21px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.modal-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--grey-mid); margin-top: 6px; letter-spacing: 0.04em; }
.modal-close { background: var(--grey-light); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--grey-mid); transition: background 0.15s; }
.modal-close:hover { background: var(--grey); color: var(--black); }
.modal-body { padding: 18px 26px 26px; }
.modal-desc { font-size: 13px; line-height: 1.65; color: #3a3a3a; margin-bottom: 22px; }
.modal-meta-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
.modal-meta-item { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--grey-mid); letter-spacing: 0.06em; text-transform: uppercase; }
.modal-meta-item strong { color: var(--black); display: block; margin-top: 2px; font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0; text-transform: none; font-style: normal; }
.prep-timeline { background: var(--black); border-radius: 10px; padding: 18px 20px; margin-bottom: 22px; }
.prep-timeline h4 { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); margin-bottom: 14px; }
.prep-item { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
.prep-item:last-child { margin-bottom: 0; }
.prep-dot-line { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.prep-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.prep-line { width: 1px; height: 20px; background: rgba(255,255,255,0.12); margin-top: 3px; }
.prep-text { font-size: 12px; color: var(--grey); }
.prep-text strong { color: var(--cream); font-weight: 600; display: block; margin-bottom: 1px; font-size: 11px; }

/* QA */

/* ADD / EDIT FORM MODALS (shared shell) */
#add-modal-overlay, #ws-modal-overlay, #edit-ws-modal-overlay { position: fixed; inset: 0; background: rgba(14,14,14,0.6); backdrop-filter: blur(4px); z-index: 300; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
#add-modal-overlay.open, #ws-modal-overlay.open, #edit-ws-modal-overlay.open { opacity: 1; pointer-events: all; }
#add-modal, #edit-modal-inner { background: var(--cream); border-radius: 16px; width: min(440px, 92vw); transform: translateY(20px); transition: transform 0.25s; box-shadow: 0 24px 64px rgba(0,0,0,0.25); }
#add-modal-overlay.open #add-modal, #ws-modal-overlay.open #add-modal, #edit-ws-modal-overlay.open #edit-modal-inner { transform: translateY(0); }
.add-modal-header { padding: 22px 22px 14px; border-bottom: 1px solid var(--grey-light); display: flex; justify-content: space-between; align-items: center; }
.add-modal-title { font-size: 17px; font-weight: 800; letter-spacing: -0.03em; }
.add-modal-body { padding: 18px 22px 22px; }
.field { margin-bottom: 14px; }
.field label { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--grey-mid); display: block; margin-bottom: 5px; }
.field input, .field select, .field textarea { width: 100%; border: 1.5px solid var(--grey-light); border-radius: 8px; background: var(--white); padding: 8px 11px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; color: var(--black); transition: border-color 0.15s; appearance: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--black); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.add-modal-footer { display: flex; gap: 10px; justify-content: flex-end; padding: 0 22px 22px; }
.btn-cancel { background: var(--grey-light); border: none; border-radius: 100px; padding: 9px 16px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--grey-mid); }
.btn-cancel:hover { background: var(--grey); color: var(--black); }
.btn-save { background: var(--black); color: var(--green); border: none; border-radius: 100px; padding: 9px 20px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-save:hover { opacity: 0.8; }

/* PASSWORD GATE */
#gate-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--black);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.3s;
}
#gate-overlay.hidden { opacity: 0; pointer-events: none; }
.gate-box { text-align: center; padding: 0 24px; }
.gate-wordmark { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; color: var(--cream); margin-bottom: 32px; }
.gate-wordmark span { color: var(--green); }
.gate-label { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 14px; letter-spacing: 0.04em; text-transform: uppercase; font-family: 'DM Mono', monospace; }
.gate-input {
  display: block; width: 220px; margin: 0 auto 14px;
  background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 10px; color: var(--cream);
  font-family: 'DM Mono', monospace; font-size: 18px;
  letter-spacing: 0.15em; text-align: center;
  padding: 12px 16px; outline: none;
  transition: border-color 0.15s;
}
.gate-input:focus { border-color: var(--green); }
.gate-input.error { border-color: #FF6B4A; animation: shake 0.3s ease; }
.gate-btn {
  background: var(--green); color: var(--black); border: none;
  border-radius: 100px; padding: 11px 32px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: opacity 0.15s; width: 220px;
}
.gate-btn:hover { opacity: 0.85; }
.gate-error { font-size: 12px; color: #FF6B4A; margin-top: 12px; min-height: 18px; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

/* CONFIRM MODAL */
#confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(17,17,16,0.55); backdrop-filter: blur(3px); z-index: 9000; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.2s; }

/* ERROR BANNER (diagnostic aid only — should never fire under normal use) */
#js-error-banner { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 600px; margin: 0 auto; background: #1a1a1a; color: #ff8a80; font-family: monospace; font-size: 11px; padding: 12px 16px; border-radius: 8px; z-index: 99999; box-shadow: 0 4px 20px rgba(0,0,0,0.4); line-height: 1.5; }
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate-overlay">
  <div class="gate-box">
    <div class="gate-wordmark">JUNGLE<span>.</span></div>
    <div class="gate-label">Enter password to continue</div>
    <input class="gate-input" type="password" id="gate-input" placeholder="••••••••" autocomplete="off" onkeydown="if(event.key==='Enter')checkGate()">
    <br>
    <button class="gate-btn" onclick="checkGate()">Enter</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

<header id="topbar">
  <div class="wordmark">JUNGLE<span>.</span></div>
  <div class="nav-tabs">
    <a class="nav-tab" href="https://jungle-is-massive.github.io/jungle-bd-planner/">← Full Plan</a>
    <a class="nav-tab active" href="calendar.html">Calendar</a>
  </div>
  <div style="display:flex;gap:8px;align-items:center" class="topbar-right">
    <button class="add-btn" id="ws-btn" onclick="openWsModal()" style="opacity:0.7">+ Workstream</button>
    <button class="add-btn" id="add-btn" onclick="openAddModal()">+ Add Event</button>
  </div>
</header>

<div id="tooltip"><div class="tt-name"></div><div class="tt-date"></div><div class="tt-loc"></div></div>

<div class="page-body">
  <div id="month-header-sticky">
    <div id="month-header-inner">
      <div id="month-header"></div>
    </div>
  </div>
  <div id="planner-wrap">
    <div id="planner">
      <div id="rows-container"></div>
    </div>
  </div>
  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--c-intermediary)"></div>Intermediary</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--c-owned);border:1px solid #666"></div>Owned</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--c-speaking)"></div>Speaking</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--c-attendance)"></div>Attending</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--c-content)"></div>Content</div>
  </div>
</div>


<!-- EVENT DETAIL MODAL -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-cat-pill" id="modal-pill"></div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-date" id="modal-date"></div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-meta-row" id="modal-meta"></div>
      <div id="modal-prep"></div>
      <p class="modal-desc" id="modal-desc"></p>
      <div style="padding:0 22px 20px;display:flex;justify-content:flex-end;gap:10px;margin-top:8px">
        <button onclick="openEditEvent()" style="background:var(--black);color:var(--green);border:none;padding:9px 20px;border-radius:100px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:12px;cursor:pointer">Edit event</button>
        <button onclick="closeModalDirect()" style="background:var(--grey-light);color:var(--grey-mid);border:none;padding:9px 16px;border-radius:100px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:12px;cursor:pointer">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- ADD / EDIT EVENT MODAL -->
<div id="add-modal-overlay" onclick="closeAddModal(event)">
  <div id="add-modal">
    <div class="add-modal-header">
      <div class="add-modal-title">Add Event</div>
      <button class="modal-close" onclick="closeAddModalDirect()">✕</button>
    </div>
    <div class="add-modal-body">
      <div class="field"><label>Event Name</label><input type="text" id="add-name" placeholder="e.g. Masterclassing Social — Jun"></div>
      <div class="field-row">
        <div class="field"><label>Start Date</label><input type="date" id="add-start"></div>
        <div class="field"><label>End Date (optional)</label><input type="date" id="add-end"></div>
      </div>
      <div class="field"><label>Location</label><input type="text" id="add-location" placeholder="e.g. London"></div>
      <div class="field"><label>Workstream (row)</label>
        <select id="add-rowkey" onchange="toggleDetailUrlField()"></select>
      </div>
      <div class="field" id="add-detail-url-field" style="display:none">
        <label>Detail Page Link (optional)</label>
        <input type="url" id="add-detail-url" placeholder="https://jungle-is-massive.github.io/jungle-bd-planner/your-event-page.html">
      </div>
      <div class="field"><label>Notes (optional)</label><textarea id="add-notes" rows="2" placeholder="Any context…"></textarea></div>
    </div>
    <div class="add-modal-footer">

function buildMonths() {
  const months = [];
  const now = new Date();
  // Start from April 2026 or current month, whichever is earlier
  const hardStart = new Date(2026, 3, 1);
  const start = hardStart < now ? hardStart : new Date(now.getFullYear(), now.getMonth(), 1);
  // End 24 months from today
  const end = new Date(now.getFullYear(), now.getMonth() + 25, 1);
  const cursor = new Date(start);
  while (cursor < end) {
    const y = cursor.getFullYear();
    const m = cursor.getMonth();
    const shortYear = String(y).slice(2);
    const monthAbbr = cursor.toLocaleString('en-GB', { month: 'short' });
    months.push({ label: `${monthAbbr} ${shortYear}`, year: y, month: m });
    cursor.setMonth(cursor.getMonth() + 1);
  }
  return months;
}

async function sbFetch(path, opts={}) {
  const h = {'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`,'Content-Type':'application/json',...(opts.headers||{})};
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...opts,headers:h});
}

async function loadEvents() {
  try {
    const r = await sbFetch('events?select=*&order=start_date.asc');
    if(r.ok){
      const d = await r.json();
      if(d.length > 0){
        // Clear any localStorage events that are now in Supabase
        localStorage.removeItem('jc_events');
        return d;
      }
    }
  } catch(e){}
  // Supabase unavailable — fall back to seed + any locally saved events
  let local; try { local = JSON.parse(localStorage.getItem('jc_events')||'[]'); } catch(e){ local = []; }
  const seedIds = new Set(SEED.map(e=>e.id));
  return [...SEED, ...local.filter(e=>!seedIds.has(e.id))];
}

function attachH(el,evt){

}

function gridCols(){return `var(--sidebar-w) repeat(${MONTHS.length}, var(--col-w))`;}

function totalW(){return sw()+cw()*MONTHS.length;}

function cw(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--col-w'))||80;}

function sw(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w'))||190;}

function df(d){return Math.max(0,Math.min(1,(new Date(d)-PLAN_START)/(PLAN_END-PLAN_START)));}

function renderMonthHeader() {
  const today=new Date(), hdr=document.getElementById('month-header');
  const cols = gridCols();
  const totalWidth = totalW() + 40;
  hdr.style.gridTemplateColumns = cols;
  hdr.style.minWidth = totalWidth + 'px';
  const planner = document.getElementById('planner');
  if(planner){ planner.style.minWidth = totalWidth + 'px'; }
  let h=`<div style="width:var(--sidebar-w)"></div>`;
  MONTHS.forEach(m=>{const cur=today.getFullYear()===m.year&&today.getMonth()===m.month; h+=`<div class="month-label${cur?' current':''}">${m.label}</div>`;});
  hdr.innerHTML=h;
}

function saveCollapseState(id, collapsed) { const s=getCollapseState(); s[id]=collapsed; localStorage.setItem('jc_collapse',JSON.stringify(s)); }

    const isCollapsed = collapseState[s.id] !== false;
    const sg=document.createElement('div'); sg.className='section-group'+(isCollapsed?' collapsed':''); sg.dataset.section=s.id;
    const sh=document.createElement('div'); sh.className='section-header';
    sh.onclick=()=>{ sg.classList.toggle('collapsed'); saveCollapseState(s.id, sg.classList.contains('collapsed')); };
    sh.innerHTML=`<div></div><div style="display:flex;align-items:center"><div class="section-title">${s.label}${tierPill(s.tier)}</div><div class="section-chevron"><svg viewBox="0 0 8 5"><path d="M0 0l4 5 4-5z"/></svg></div></div>`;
    sg.appendChild(sh);
    const sr=document.createElement('div'); sr.className='section-rows';
    s.rows.forEach(rc=>{
      const rowEl = rc.placeholder?buildPlaceholder(rc):buildRow(rc,allEvents.filter(e=>e.row_key===rc.key),s.id);
      // Inject row-level tier badge into the row-label WITHOUT destroying existing child elements (icons, etc.)
      if (rc.tier && s.tier === 'mixed') {
        const lbl = rowEl.querySelector('.row-label, .placeholder-label');
        if (lbl) {
          const badge = document.createElement('span');
          badge.innerHTML = rowTierPill(rc.tier);
          // Placeholder rows are plain text labels — append badge directly
          if (lbl.classList.contains('placeholder-label')) {
            lbl.appendChild(badge.firstChild);
          } else {
            // row-label has a nested <span> for the text and a <span> for icon buttons — insert badge between them
            const textSpan = lbl.querySelector('span');
            if (textSpan) textSpan.after(badge.firstChild);
            else lbl.appendChild(badge.firstChild);
          }
        }
      }
      sr.appendChild(rowEl);
    });
    sg.appendChild(sr); c.appendChild(sg);
    initDragDrop(sg, s.id);
  });
  renderTodayLine();
  // attachToolbarToRows(); // replaced by always-visible inline icons
}

function buildPlaceholder(rc) {
  const row=document.createElement('div'); row.className='placeholder-row';
  row.style.gridTemplateColumns = gridCols();
  row.innerHTML=`<div class="placeholder-label">${rc.label}</div>`+MONTHS.map(()=>`<div class="placeholder-cell"><div class="placeholder-dash"></div></div>`).join('');
  return row;
}

function buildRow(rc, events, sectionId) {
  const row=document.createElement('div'); row.className='row'; row.dataset.rowKey=rc.key;
  row.dataset.sectionId=sectionId;
  row.dataset.label=rc.label;
  row.style.gridTemplateColumns = gridCols();
  row.innerHTML = `<div class="row-label" style="display:flex;align-items:center;gap:0;justify-content:space-between;padding-right:6px">
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${rc.label}</span>
    <span style="display:flex;gap:2px;flex-shrink:0">
      <button type="button" class="row-icon-btn row-edit-icon" title="Edit row name" aria-label="Edit row">✎</button>
      <button type="button" class="row-icon-btn row-delete-icon" title="Delete row" aria-label="Delete row">✕</button>
    </span>
  </div>`;
  const editIcon = row.querySelector('.row-edit-icon');
  const deleteIcon = row.querySelector('.row-delete-icon');
  editIcon.addEventListener('click', function(ev){
    ev.preventDefault(); ev.stopPropagation();
    try { openEditWsModal(rc.key, sectionId, ev); }
    catch(err){ console.error('openEditWsModal failed:', err); window.dispatchEvent(new ErrorEvent('error', {message: 'openEditWsModal: ' + err.message})); }
  });
  deleteIcon.addEventListener('click', function(ev){
    ev.preventDefault(); ev.stopPropagation();
    try { deleteWorkstream(rc.key, sectionId, ev); }
    catch(err){ console.error('deleteWorkstream failed:', err); window.dispatchEvent(new ErrorEvent('error', {message: 'deleteWorkstream: ' + err.message})); }
  });
  MONTHS.forEach(()=>{const c=document.createElement('div');c.className='row-cell';row.appendChild(c);});
  requestAnimationFrame(()=>plotEvents(row,events,sectionId));
  return row;
}

function plotEvents(row, events, sectionId) {
  const s=sw(), total=cw()*MONTHS.length;
  if(sectionId==='owned'){events.forEach(evt=>{const ed=new Date(evt.start_date),ps=new Date(ed);ps.setMonth(ps.getMonth()-3);addPrepBar(row,ps,ed,'#7B6FE0',s,total);});}

  // Group single-day events by date to handle overlaps
  const singles = events.filter(evt => (new Date(evt.end_date||evt.start_date)-new Date(evt.start_date)) <= 86400000);
  const multis  = events.filter(evt => (new Date(evt.end_date||evt.start_date)-new Date(evt.start_date)) > 86400000);

  // Render multi-day bars normally
  multis.forEach(evt=>{
    const sf=df(evt.start_date),ef=df(evt.end_date||evt.start_date);
    const bar=document.createElement('div'); bar.className=`event-bar category-${evt.category}`;
    bar.style.left=(s+sf*total)+'px'; bar.style.width=Math.max(20,(ef-sf)*total)+'px';
    bar.innerHTML=`<span>${evt.name}</span>`; attachH(bar,evt); row.appendChild(bar);
  });

  // Group singles by date
  const byDate = {};
  singles.forEach(evt => {
    const key = evt.start_date;
    if(!byDate[key]) byDate[key] = [];
    byDate[key].push(evt);
  });

  Object.entries(byDate).forEach(([date, evts]) => {
    const sf = df(date);
    const x = s + sf * total - 5;
    if(evts.length === 1) {
      const dot=document.createElement('div'); dot.className=`event-dot category-${evts[0].category}`;
      dot.style.left=x+'px'; attachH(dot,evts[0]); row.appendChild(dot);
    } else {
      // Cluster badge — show count, click opens a mini popover listing all
      const cluster = document.createElement('div');
      cluster.className = `event-dot category-${evts[0].category}`;
      cluster.style.left = x + 'px';
      cluster.style.width = '18px';
      cluster.style.height = '18px';
      cluster.style.borderRadius = '100px';
      cluster.style.display = 'flex';
      cluster.style.alignItems = 'center';
      cluster.style.justifyContent = 'center';
      cluster.style.fontSize = '9px';
      cluster.style.fontWeight = '700';
      cluster.style.color = evts[0].category === 'owned' ? 'var(--black)' : 'white';
      cluster.style.fontFamily = "'DM Mono', monospace";
      cluster.style.zIndex = '12';
      cluster.textContent = evts.length;
      // Tooltip shows all names
      cluster.addEventListener('mouseenter', e => {
        tooltip.querySelector('.tt-name').textContent = `${evts.length} events`;
        tooltip.querySelector('.tt-date').textContent = evts.map(ev=>ev.name).join(' · ');
        tooltip.querySelector('.tt-loc').textContent = '';
        tooltip.classList.add('visible'); mvTip(e);
      });
      cluster.addEventListener('mousemove', mvTip);
      cluster.addEventListener('mouseleave', ()=>tooltip.classList.remove('visible'));
      cluster.addEventListener('click', e => { e.stopPropagation(); openClusterModal(evts); });
      row.appendChild(cluster);
    }
  });
}

function openClusterModal(evts) {

  // Build a picker in the existing modal
  currentModalEvent = evts[0];
  const labels={intermediary:'Intermediary',owned:'Owned Event',speaking:'Speaking',attendance:'Attendance',content:'Content',nurture:'Nurture'};

function addPrepBar(row,start,end,color,s,total){
  const bar=document.createElement('div'); bar.className='prep-bar';
  const sf=df(start.toISOString().split('T')[0]),ef=df(end.toISOString().split('T')[0]);
  bar.style.left=(s+sf*total)+'px'; bar.style.width=Math.max(0,(ef-sf)*total)+'px';
  bar.style.background=color; row.appendChild(bar);
}

function renderTodayLine(){
  document.querySelectorAll('.today-line').forEach(e=>e.remove());
  const f=df(new Date().toISOString().split('T')[0]);
  if(f<0||f>1)return;
  const x=sw()+f*cw()*MONTHS.length;
  document.querySelectorAll('.row').forEach(row=>{const l=document.createElement('div');l.className='today-line';l.style.left=x+'px';row.appendChild(l);});
}

function mvTip(e){tooltip.style.left=(e.clientX+14)+'px';tooltip.style.top=(e.clientY-10)+'px';}

async function openModal(evt) {
  currentModalEvent=evt;
  const labels={intermediary:'Intermediary',owned:'Owned Event',speaking:'Speaking',attendance:'Attendance',content:'Content',nurture:'Nurture'};
  const pill=document.getElementById('modal-pill'); pill.textContent=labels[evt.category]||evt.category; pill.className=`modal-cat-pill ${evt.category}`;

  // Infer tier from SECTIONS — match row_key → row → tier (falling back to section tier)
  let tier = null;
  for (const s of SECTIONS) {
    for (const r of s.rows) {
      if (r.key === evt.row_key) { tier = r.tier || s.tier; break; }
    }
    if (tier) break;
  }
  // Update tier-chip next to the pill
  let tierChip = document.getElementById('modal-tier-chip');
  if (!tierChip) {
    tierChip = document.createElement('span');
    tierChip.id = 'modal-tier-chip';
    tierChip.style.cssText = 'margin-left:8px;font-family:\'DM Mono\',monospace;font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:4px 10px;border-radius:100px;display:none';
    pill.after(tierChip);
  }
  if (tier && tier !== 'mixed') {
    const tierColors = {
      buzz: {bg:'rgba(74,191,255,0.15)', fg:'#0a5a8c', border:'rgba(74,191,255,0.3)'},
      rumble: {bg:'rgba(240,180,41,0.18)', fg:'#7a4e00', border:'rgba(240,180,41,0.35)'},
      roar: {bg:'rgba(255,107,74,0.18)', fg:'#8a2400', border:'rgba(255,107,74,0.35)'}
    };
    const c = tierColors[tier];
    tierChip.textContent = tier;
    tierChip.style.background = c.bg;
    tierChip.style.color = c.fg;
    tierChip.style.border = `1px solid ${c.border}`;
    tierChip.style.display = 'inline-block';
  } else {
    tierChip.style.display = 'none';
  }

  document.getElementById('modal-title').textContent=evt.name;
  document.getElementById('modal-date').textContent=fmtR(evt.start_date,evt.end_date);
  const meta=document.getElementById('modal-meta');
  // Edit/delete buttons for any manually-managed event (not auto-generated TL/nurture content)
  const autoGenerated = evt.category === 'content' || evt.category === 'nurture';
  const canEdit = !autoGenerated;
  const editBtns = canEdit ? `
    <div style="display:flex;gap:8px;margin-top:8px">
      <button onclick="openEditEvent()" style="background:var(--black);color:var(--green);border:none;border-radius:100px;padding:7px 16px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer">✎ Edit</button>
      <button onclick="deleteEvent('${evt.id}')" style="background:none;border:1.5px solid rgba(192,57,43,0.3);color:#c0392b;border-radius:100px;padding:7px 16px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer">Delete</button>
    </div>` : '';
  meta.innerHTML=(evt.location?`<div class="modal-meta-item">Location<strong>${evt.location}</strong></div>`:'')+`<div class="modal-meta-item">Type<strong>${labels[evt.category]}</strong></div>${tier && tier !== 'mixed' ? `<div class="modal-meta-item">Tier<strong style="text-transform:capitalize">${tier}</strong></div>` : ''}${editBtns}`;
  const prep=document.getElementById('modal-prep');
  if(evt.category==='owned'){
    const ed=new Date(evt.start_date);
    const steps=[[addM(ed,-3),'Speaker sourcing begins (3 months out)'],[addD(ed,-56),'Invitations sent (8 weeks out)'],[addD(ed,-21),'Final reminders + nurture comms'],[ed,'Event day'],[addD(ed,7),'Post-event burst comms (1–3 weeks)'],[addD(ed,35),'Fortnightly nurture → monthly cadence']];
    const hubLink = evt.detail_url
      ? `<a href="${evt.detail_url}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:var(--green);color:var(--black);font-size:12px;font-weight:700;padding:9px 18px;border-radius:100px;text-decoration:none;font-family:'DM Sans',sans-serif">Open Event Hub →</a>`
      : `<div style="display:inline-flex;align-items:center;gap:6px;margin-top:14px;color:var(--grey-mid);font-size:11px;font-family:'DM Mono',monospace">No detail page linked yet — add one via Edit</div>`;
    prep.innerHTML=`<div class="prep-timeline"><h4>Preparation Timeline</h4>${steps.map(([d,t],i,a)=>`<div class="prep-item"><div class="prep-dot-line"><div class="prep-dot"></div>${i<a.length-1?'<div class="prep-line"></div>':''}</div><div class="prep-text"><strong>${fmtDate(d)}</strong>${t}</div></div>`).join('')}</div>${hubLink}`;
  } else { prep.innerHTML=''; }
  document.getElementById('modal-desc').textContent=evt.description||'';
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e){if(e.target===document.getElementById('modal-overlay'))closeModalDirect();}

function closeModalDirect(){document.getElementById('modal-overlay').classList.remove('open');currentModalEvent=null;}

function openEditEvent() {
  if(!currentModalEvent) return;
  const evt = currentModalEvent;
  // Close the detail modal and open add modal pre-filled
  closeModalDirect();
  // Pre-fill the add event form
  document.getElementById('add-name').value = evt.name || '';
  document.getElementById('add-start').value = evt.start_date || '';
  document.getElementById('add-end').value = evt.end_date || '';
  document.getElementById('add-location').value = evt.location || '';
  document.getElementById('add-notes').value = evt.description || '';
  // Set the workstream dropdown to match
  const sel = document.getElementById('add-rowkey');
  // Rebuild dropdown first
  openAddModal();
  // Then set value and mark as editing
  sel.value = evt.row_key || 'event-attendance';
  document.getElementById('add-detail-url').value = evt.detail_url || '';
  toggleDetailUrlField();
  // Store the id we're editing
  window._editingEventId = evt.id;
  document.querySelector('#add-modal .add-modal-title').textContent = 'Edit Event';
  document.querySelector('#add-modal .btn-save').textContent = 'Save Changes';
}

async function deleteEvent(id) {
  const evt = allEvents.find(e => e.id === id);
  if(!evt) return;
  const confirmed = await showConfirm({ title: 'Delete Event', message: `Delete "${evt.name}"? This can't be undone.`, confirmLabel: 'Delete', confirmClass: 'danger' });
  if(!confirmed) return;
  closeModalDirect();
  try {
    await sbFetch(`events?id=eq.${id}`, {method:'DELETE', headers:{'Prefer':'return=minimal'}});
  } catch(e) {}
  allEvents = allEvents.filter(e => e.id !== id);
  renderRows();
}

function openAddModal(){
  const sel = document.getElementById('add-rowkey');
  sel.innerHTML = '';
  const catMap = {intermediaries:'intermediary',owned:'owned',speaking:'speaking',attendance:'attendance',content:'content'};
  SECTIONS.forEach(section => {
    const nonPlaceholder = section.rows.filter(r=>!r.placeholder);
    if(!nonPlaceholder.length) return;
    const grp = document.createElement('optgroup');
    grp.label = section.label;
    nonPlaceholder.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.key;
      opt.dataset.category = catMap[section.id] || 'attendance';
      opt.textContent = r.label;
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });
  document.getElementById('add-detail-url').value = '';
  toggleDetailUrlField();
  document.getElementById('add-modal-overlay').classList.add('open');
}

function closeAddModal(e){if(e.target===document.getElementById('add-modal-overlay'))closeAddModalDirect();}

function closeAddModalDirect(){
  document.getElementById('add-modal-overlay').classList.remove('open');
  // Reset modal back to "Add" state in case it was in edit mode
  window._editingEventId = null;
  const titleEl = document.querySelector('#add-modal .add-modal-title');
  const saveEl = document.querySelector('#add-modal .btn-save');
  if(titleEl) titleEl.textContent = 'Add Event';
  if(saveEl) saveEl.textContent = 'Save Event';
}

async function saveEvent(){
  const name=document.getElementById('add-name').value.trim(), start=document.getElementById('add-start').value;
  const end=document.getElementById('add-end').value||start, location=document.getElementById('add-location').value.trim();
  const sel=document.getElementById('add-rowkey');
  const rowKey=sel.value, category=sel.options[sel.selectedIndex]?.dataset.category||'attendance';
  const notes=document.getElementById('add-notes').value.trim();
  const detailUrl=document.getElementById('add-detail-url').value.trim();
  if(!name||!start){alert('Name and start date required.');return;}

  const editId = window._editingEventId;

  if(editId) {
    // Edit existing event
    const payload = {name, category, start_date:start, end_date:end, location, description:notes, row_key:rowKey, detail_url:detailUrl||null};
    try {
      await sbFetch(`events?id=eq.${editId}`, {method:'PATCH', headers:{'Prefer':'return=minimal'}, body:JSON.stringify(payload)});
    } catch(e){}
    const idx = allEvents.findIndex(e=>e.id===editId);
    if(idx>-1) allEvents[idx] = {...allEvents[idx], ...payload};
    window._editingEventId = null;
  } else {
    // Add new event
    const evt={id:'local-'+Date.now(),name,category,start_date:start,end_date:end,location,description:notes,row_key:rowKey,detail_url:detailUrl||null};
    let saved=false;
    try{
      const r=await sbFetch('events',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({name,category,start_date:start,end_date:end,location,description:notes,row_key:rowKey,detail_url:detailUrl||null})});
      if(r.ok){const d=await r.json();if(d[0])evt.id=d[0].id;saved=true;}
    }catch(e){}
    if(!saved){let local; try { local=JSON.parse(localStorage.getItem('jc_events')||'[]'); } catch(e){ local=[]; } local.push(evt);localStorage.setItem('jc_events',JSON.stringify(local));}
    allEvents.push(evt);
  }

  SECTIONS.forEach(s=>{ if(s.rows.find(r=>r.key===rowKey)){ const state=getCollapseState(); state[s.id]=false; localStorage.setItem('jc_collapse',JSON.stringify(state)); } });
  renderRows(); closeAddModalDirect();
  ['add-name','add-start','add-end','add-location','add-notes','add-detail-url'].forEach(id=>document.getElementById(id).value='');
}

function toggleDetailUrlField(){
  const sel = document.getElementById('add-rowkey');
  const category = sel.options[sel.selectedIndex]?.dataset.category;
  document.getElementById('add-detail-url-field').style.display = (category === 'owned') ? '' : 'none';
}

// ── Calendar rows — Supabase-backed, single source of truth ──────────────────
// Stable ids (calendar_rows.id) never change once created, even when the label is
// edited. This is what events.row_key references, so renaming a row can never
// orphan or duplicate events the way the old localStorage approach did.

async function loadCalendarRows() {
  let rows = [];
  try {
    const r = await sbFetch('calendar_rows?select=*&order=section_id,sort_order');
    if (r.ok) rows = await r.json();
  } catch(e){}
  SECTIONS.forEach(s => { s.rows = []; });
  rows.forEach(row => {
    const section = SECTIONS.find(s => s.id === row.section_id);
    if (!section) return;
    const entry = { key: row.id, label: row.label };
    if (row.tier) entry.tier = row.tier;
    if (row.placeholder) entry.placeholder = true;
    section.rows.push(entry);
  });
}

function openWsModal(){
  document.getElementById('ws-modal-overlay').classList.add('open');
  document.getElementById('ws-name').value='';
  populateWsSection('ws-section');
}

function closeWsModal(e){ if(e.target===document.getElementById('ws-modal-overlay'))closeWsModalDirect(); }

function closeWsModalDirect(){ document.getElementById('ws-modal-overlay').classList.remove('open'); }

function populateWsSection(selectId) {
  const sel = document.getElementById(selectId);
  const prev = sel.value;
  sel.innerHTML = SECTIONS.map(s=>`<option value="${s.id}">${s.label}</option>`).join('');
  if(prev && sel.querySelector(`option[value="${prev}"]`)) sel.value = prev;
}

async function saveWorkstream(){
  const name=document.getElementById('ws-name').value.trim();
  const sectionId=document.getElementById('ws-section').value;
  if(!name)return;
  const id='custom-'+name.toLowerCase().replace(/[^a-z0-9]/g,'-')+'-'+Date.now();
  const section=SECTIONS.find(s=>s.id===sectionId);
  const sortOrder = section ? section.rows.length : 0;
  try {
    await sbFetch('calendar_rows', {
      method:'POST', headers:{'Prefer':'return=minimal'},
      body: JSON.stringify({ id, section_id: sectionId, label: name, sort_order: sortOrder })
    });
  } catch(e){}
  if(section){ section.rows.push({key:id, label:name}); }
  const state=getCollapseState(); state[sectionId]=false; localStorage.setItem('jc_collapse',JSON.stringify(state));
  renderRows(); closeWsModalDirect();
}

function openEditWsModal(key, sectionId, e){
  if(e) e.stopPropagation();
  const section = SECTIONS.find(s=>s.id===sectionId);
  const rowData = section?.rows.find(r=>r.key===key);
  const domRow = document.querySelector(`.row[data-row-key="${key}"]`);
  const label = rowData?.label || domRow?.dataset.label || key;
  document.getElementById('edit-ws-key').value = key;
  document.getElementById('edit-ws-original-section').value = sectionId;
  document.getElementById('edit-ws-name').value = label;
  populateWsSection('edit-ws-section');
  document.getElementById('edit-ws-section').value = sectionId;
  document.getElementById('edit-ws-modal-overlay').classList.add('open');
}

function closeEditWsModal(e){ if(!e||e.target===document.getElementById('edit-ws-modal-overlay')) document.getElementById('edit-ws-modal-overlay').classList.remove('open'); }

async function saveEditWorkstream(){
  const key = document.getElementById('edit-ws-key').value;
  const origSectionId = document.getElementById('edit-ws-original-section').value;
  const newSectionId = document.getElementById('edit-ws-section').value;
  const newName = document.getElementById('edit-ws-name').value.trim();
  if(!newName) return;
  // The row's id (key) never changes — only its label and/or section. This is what
  // keeps existing events linked correctly through a rename or a move between sections.
  try {
    await sbFetch(`calendar_rows?id=eq.${encodeURIComponent(key)}`, {
      method:'PATCH', headers:{'Prefer':'return=minimal'},
      body: JSON.stringify({ label: newName, section_id: newSectionId, updated_at: new Date().toISOString() })
    });
  } catch(e){}
  const origSection = SECTIONS.find(s=>s.id===origSectionId);
  const rowEntry = origSection?.rows.find(r=>r.key===key) || { key };
  rowEntry.label = newName;
  if(origSection){ origSection.rows = origSection.rows.filter(r=>r.key!==key); }
  const newSection = SECTIONS.find(s=>s.id===newSectionId);
  if(newSection){ newSection.rows.push(rowEntry); }
  const state=getCollapseState(); state[newSectionId]=false; localStorage.setItem('jc_collapse',JSON.stringify(state));
  renderRows(); closeEditWsModal();
}

async function deleteWorkstream(key, sectionId, e){
  if(e) e.stopPropagation();
  if(!confirm('Delete this workstream row?')) return;
  try {
    await sbFetch(`calendar_rows?id=eq.${encodeURIComponent(key)}`, { method:'DELETE', headers:{'Prefer':'return=minimal'} });
  } catch(e){}
  const section = SECTIONS.find(s=>s.id===sectionId);
  if(section){ section.rows = section.rows.filter(r=>r.key!==key); }
  renderRows();
}

let _reorderSaveTimer = null;
function persistRowOrderDebounced(sectionId) {
  clearTimeout(_reorderSaveTimer);
  _reorderSaveTimer = setTimeout(() => persistRowOrder(sectionId), 400);
}

async function persistRowOrder(sectionId) {
  const section = SECTIONS.find(s=>s.id===sectionId);
  if(!section) return;
  // Write each row's new sort_order back to Supabase. Small section sizes make
  // one PATCH per row acceptable; this only fires after a drag, debounced.
  await Promise.all(section.rows.map((r, idx) =>
    sbFetch(`calendar_rows?id=eq.${encodeURIComponent(r.key)}`, {
      method:'PATCH', headers:{'Prefer':'return=minimal'},
      body: JSON.stringify({ sort_order: idx })
    }).catch(()=>{})
  ));
}

function initDragDrop(sg, sectionId) {
  const sr = sg.querySelector('.section-rows');
  sr.querySelectorAll('.row[data-row-key]').forEach(row => {
    row.draggable = true;
    row.addEventListener('dragstart', e => {
      dragSrc = row; dragSrcSection = sectionId;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(()=>row.style.opacity='0.4', 0);
    });
    row.addEventListener('dragend', () => { row.style.opacity=''; dragSrc=null; });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      if(dragSrc && dragSrc!==row && dragSrcSection===sectionId){
        const mid = row.getBoundingClientRect().top + row.getBoundingClientRect().height/2;
        if(e.clientY < mid) sr.insertBefore(dragSrc, row);
        else sr.insertBefore(dragSrc, row.nextSibling);
      }
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      if(dragSrcSection !== sectionId) return;
      const section = SECTIONS.find(s=>s.id===sectionId);
      if(!section) return;
      const newOrder = [];
      sr.querySelectorAll('.row[data-row-key]').forEach(r => {
        const found = section.rows.find(x=>x.key===r.dataset.rowKey);
        if(found) newOrder.push(found);
      });
      section.rows.forEach(r => { if(!newOrder.find(x=>x.key===r.key)) newOrder.push(r); });
      section.rows = newOrder;
      persistRowOrderDebounced(sectionId);
    });
  });
}
function fmtR(s,e){
  if(!e||e===s)return fmtDate(new Date(s));
  const sd=new Date(s),ed=new Date(e);
  if(sd.getMonth()===ed.getMonth()&&sd.getFullYear()===ed.getFullYear())return `${sd.getDate()}–${ed.getDate()} ${sd.toLocaleString('en-GB',{month:'short'})} ${sd.getFullYear()}`;
  return `${fmtDate(sd)} – ${fmtDate(ed)}`;
}

function fmtDate(d){if(typeof d==='string')d=new Date(d);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}

function addM(d,n){const r=new Date(d);r.setMonth(r.getMonth()+n);return r;}

function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}

function showConfirm({ title = 'Are you sure?', message = '', confirmLabel = 'Delete', confirmClass = 'danger' }) {
  return new Promise(resolve => {
    _confirmResolve = resolve;
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-message').textContent = message;
    const btn = document.getElementById('confirm-ok-btn');
    btn.textContent = confirmLabel;
    const overlay = document.getElementById('confirm-overlay');
    const box = overlay.querySelector('.confirm-box');
    overlay.style.display = 'flex';
    requestAnimationFrame(() => {
      overlay.style.opacity = '1';
      box.style.transform = 'translateY(0)';
    });
  });
}

function _confirmClose(result) {
  const overlay = document.getElementById('confirm-overlay');
  const box = overlay.querySelector('.confirm-box');
  overlay.style.opacity = '0';
  box.style.transform = 'translateY(16px)';
  setTimeout(() => { overlay.style.display = 'none'; }, 200);
  if (_confirmResolve) { _confirmResolve(result); _confirmResolve = null; }
}

function checkGate() {
  const val = document.getElementById('gate-input').value;
  if (val === GATE_PASSWORD) {
    sessionStorage.setItem('jc_auth', '1');
    const overlay = document.getElementById('gate-overlay');
    overlay.classList.add('hidden');
    setTimeout(() => overlay.remove(), 350);
    init();
  } else {
    const input = document.getElementById('gate-input');
    const err = document.getElementById('gate-error');
    input.classList.add('error');
    err.textContent = 'Incorrect password';
    setTimeout(() => { input.classList.remove('error'); input.value = ''; err.textContent = ''; }, 1000);
  }
}


function esc(s){s=s==null?'':String(s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function init(){
  // Sync month header horizontal scroll with planner
  const wrap = document.getElementById('planner-wrap');
  const hdrInner = document.getElementById('month-header-inner');
  wrap.addEventListener('scroll', () => { hdrInner.scrollLeft = wrap.scrollLeft; }, {passive: true});
  // Workstream rows (id, label, section, tier, order) live in Supabase — load before first render.
  await loadCalendarRows();
  renderMonthHeader();
  allEvents = await loadEvents();
  renderRows();
  const f = df(new Date().toISOString().split('T')[0]);
  document.getElementById('planner-wrap').scrollLeft = Math.max(0, sw()+f*cw()*MONTHS.length-window.innerWidth*0.4);
}

// Only auto-init if already authenticated this session
if (sessionStorage.getItem('jc_auth') === '1') {
  document.getElementById('gate-overlay').remove();
  init();
} else {
  document.getElementById('gate-input').focus();
}
